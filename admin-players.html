// Resize while preserving the original aspect ratio (no forced square
// crop) — better for crest/shield-style logos that look wrong cropped
// to a circle.
function resizeOriginal(file, maxDim = 480) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Interactive crop: lets the admin drag/zoom a photo into a circular frame
// before it's compressed and saved. onDone receives a square JPEG data URL
// (or null if cancelled).
function openCropper(file, containerEl, onDone) {
  const frameSize = 200;
  const OUT = 480;

  function clamp(state) {
    const dispW = state.naturalW * state.scale, dispH = state.naturalH * state.scale;
    state.offsetX = Math.min(0, Math.max(frameSize - dispW, state.offsetX));
    state.offsetY = Math.min(0, Math.max(frameSize - dispH, state.offsetY));
  }
  function render(imgEl, state) {
    imgEl.style.width = (state.naturalW * state.scale) + 'px';
    imgEl.style.height = (state.naturalH * state.scale) + 'px';
    imgEl.style.transform = `translate(${state.offsetX}px, ${state.offsetY}px)`;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const minScale = Math.max(frameSize / img.naturalWidth, frameSize / img.naturalHeight);
      const state = {
        naturalW: img.naturalWidth, naturalH: img.naturalHeight,
        scale: minScale, minScale, maxScale: minScale * 3,
        offsetX: (frameSize - img.naturalWidth * minScale) / 2,
        offsetY: (frameSize - img.naturalHeight * minScale) / 2
      };
      clamp(state);

      containerEl.innerHTML = `
        <div class="crop-wrap">
          <p>Drag to reposition · use the slider to zoom</p>
          <div class="crop-frame" id="cropFrame"><img id="cropImg" src="${e.target.result}"></div>
          <div class="zoom-row"><span>🔍</span><input type="range" id="zoomSlider" min="0" max="100" value="0"></div>
          <div class="crop-btn-row">
            <button type="button" class="btn btn-secondary" id="btnCancelCrop">Cancel</button>
            <button type="button" class="btn btn-gold" id="btnUseCrop">Use This Photo</button>
          </div>
        </div>`;

      const frameEl = document.getElementById('cropFrame');
      const imgEl = document.getElementById('cropImg');
      const zoomEl = document.getElementById('zoomSlider');
      render(imgEl, state);

      let dragging = false, startX, startY, startOffX, startOffY;
      frameEl.addEventListener('pointerdown', (ev) => {
        dragging = true; frameEl.setPointerCapture(ev.pointerId);
        startX = ev.clientX; startY = ev.clientY;
        startOffX = state.offsetX; startOffY = state.offsetY;
        frameEl.classList.add('dragging');
      });
      frameEl.addEventListener('pointermove', (ev) => {
        if (!dragging) return;
        state.offsetX = startOffX + (ev.clientX - startX);
        state.offsetY = startOffY + (ev.clientY - startY);
        clamp(state);
        render(imgEl, state);
      });
      const stopDrag = () => { dragging = false; frameEl.classList.remove('dragging'); };
      frameEl.addEventListener('pointerup', stopDrag);
      frameEl.addEventListener('pointercancel', stopDrag);

      zoomEl.addEventListener('input', () => {
        const t = zoomEl.value / 100;
        const newScale = state.minScale + t * (state.maxScale - state.minScale);
        const cx = frameSize / 2, cy = frameSize / 2;
        const relX = (cx - state.offsetX) / state.scale, relY = (cy - state.offsetY) / state.scale;
        state.scale = newScale;
        state.offsetX = cx - relX * state.scale;
        state.offsetY = cy - relY * state.scale;
        clamp(state);
        render(imgEl, state);
      });

      document.getElementById('btnCancelCrop').onclick = () => onDone(null);
      document.getElementById('btnUseCrop').onclick = () => {
        const f = OUT / frameSize;
        const canvas = document.createElement('canvas');
        canvas.width = OUT; canvas.height = OUT;
        canvas.getContext('2d').drawImage(
          img,
          state.offsetX * f, state.offsetY * f,
          state.naturalW * state.scale * f, state.naturalH * state.scale * f
        );
        onDone(canvas.toDataURL('image/jpeg', 0.8));
      };
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderModalAvatarPick(p) {

      <div style="flex:1;">
        <input type="file" id="m-photo" accept="image/jpeg,image/png,image/webp">
      </div>
    </div>
  `;
  document.getElementById('m-photo').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    openCropper(file, area, (dataUrl) => {
      if (dataUrl) pickedPhotoDataUrl = dataUrl;
      renderModalAvatarPick(p);
      if (dataUrl) document.getElementById('mAvatarPreview').innerHTML = `<img src="${dataUrl}">`;
    });
  });
}

        </label>

  `;

    const file = e.target.files[0];

    });
  });
}

  });

    photoMap = {};
    snap.forEach(doc => { photoMap[doc.id] = doc.data().photoBase64; });
    renderRows(document.getElementById('search').value);
  });
  TEAM_LOGOS.onSnapshot(snap => {
    teamLogoMap = {};
    snap.forEach(doc => { teamLogoMap[doc.id] = doc.data().logoBase64; });
    renderRows(document.getElementById('search').value);
  });
  document.getElementById('search').addEventListener('input', e => renderRows(e.target.value));
  document.getElementById('btnCloseModal').onclick = () => document.getElementById('modalOverlay').classList.remove('show');

function renderRows(filterText) {
  const tbody = document.getElementById('rows');
  if (!auction) { tbody.innerHTML = `<tr><td colspan="6">No auction data yet.</td></tr>`; return; }
  const q = (filterText||'').trim().toLowerCase();
  const players = (auction.players||[]).filter(p => !q || p.name.toLowerCase().includes(q))
    .slice().sort((a,b) => (a.number||0) - (b.number||0));

  tbody.innerHTML = players.map(p => {
    const photo = photoMap[p.id];
    const avatar = photo
      ? `<img src="${photo}">`
      : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#2F5233;color:#fff;">${esc(initials(p.name))}</div>`;
    return `<tr>
      <td><div class="row-avatar">${avatar}</div></td>
      <td>${esc(p.name)}</td>
      <td>${p.isCaptain ? '👑 Owner' : 'Player'}</td>
      <td>${p.isCaptain ? `${teamLogoMap[p.teamId]?`<img class="club-logo" src="${teamLogoMap[p.teamId]}" alt="">`:''}${esc(p.teamName||'')}` : (() => { const logo = getClubLogo(p.club); return `${logo?`<img class="club-logo" src="${logo}" alt="">`:''}${esc(p.club||'')}`; })()}</td>
      <td>${photo ? '✓' : '<span style="color:var(--muted);">–</span>'}</td>
      <td><button class="btn btn-ghost" data-edit="${esc(p.id)}">Edit</button> <a class="btn btn-ghost" href="player.html?id=${esc(p.id)}" target="_blank">View</a></td>
    </tr>`;
  }).join('') || `<tr><td colspan="6">No players match.</td></tr>`;

  tbody.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = () => openModal(btn.dataset.edit);
  });
}

function openModal(id) {

  editingId = id;
  pickedPhotoDataUrl = null;
  pickedTeamLogoDataUrl = null;
  document.getElementById('modalName').textContent = 'Edit ' + p.name;
  document.getElementById('m-name').value = p.name || '';
  document.getElementById('m-notes').value = p.notes || '';

  const isOther = p.club && !CLUB_NAMES.includes(p.club);
  document.getElementById('m-club').innerHTML = `
    <option value="">— Select club —</option>
    ${CLUB_NAMES.map(c => `<option value="${esc(c)}" ${p.club===c?'selected':''}>${esc(c)}</option>`).join('')}
    <option value="__other__" ${isOther?'selected':''}>Other (type below)</option>
  `;
  document.getElementById('mClubOtherWrap').hidden = !isOther;
  document.getElementById('m-club-other').value = isOther ? p.club : '';
  document.getElementById('m-club').onchange = (e) => {
    document.getElementById('mClubOtherWrap').hidden = e.target.value !== '__other__';
  };

  document.getElementById('mOwnerTeamNameWrap').hidden = !p.isCaptain;
  document.getElementById('m-teamname').value = p.teamName || '';

  renderModalAvatarPick(p);
  document.getElementById('mTeamLogoWrap').hidden = !p.isCaptain;
  if (p.isCaptain) renderModalTeamLogoPick(p);
  document.getElementById('modalMsg').textContent = '';
  document.getElementById('modalOverlay').classList.add('show');
}

async function saveModal() {
  const btn = document.getElementById('btnSaveModal');
  const msg = document.getElementById('modalMsg');
  btn.disabled = true;
  try {
    if (pickedPhotoDataUrl) {
      await PHOTOS.doc(editingId).set({ photoBase64: pickedPhotoDataUrl, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      pickedPhotoDataUrl = null;
    }
    const editingPlayer = (auction.players||[]).find(x => x.id === editingId);
    if (pickedTeamLogoDataUrl && editingPlayer && editingPlayer.isCaptain && editingPlayer.teamId) {
      await TEAM_LOGOS.doc(editingPlayer.teamId).set({ logoBase64: pickedTeamLogoDataUrl, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      pickedTeamLogoDataUrl = null;
    }
    const nameVal = document.getElementById('m-name').value.trim();
    const clubSel = document.getElementById('m-club').value;
    const clubVal = clubSel === '__other__' ? document.getElementById('m-club-other').value.trim() : clubSel;
    const teamNameVal = document.getElementById('m-teamname').value.trim();
    const notes = document.getElementById('m-notes').value.trim();
    if (!nameVal) { msg.textContent = 'Name cannot be empty.'; msg.className = 'msg err'; btn.disabled = false; return; }

    const snap = await AUCTION_REF.get();
    const data = snap.data();
    const players = (data.players||[]).map(x => {
      if (x.id !== editingId) return x;
      return x.isCaptain
        ? { ...x, name: nameVal, club: clubVal, teamName: teamNameVal || x.teamName, notes }
        : { ...x, name: nameVal, club: clubVal, notes };
    });
    await AUCTION_REF.update({ players, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });

    msg.textContent = '✓ Saved';
    msg.className = 'msg ok';
    setTimeout(() => document.getElementById('modalOverlay').classList.remove('show'), 500);
  } catch (e) {
    msg.textContent = 'Error: ' + e.message;
    msg.className = 'msg err';
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
