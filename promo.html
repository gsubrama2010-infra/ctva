<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="images/TeamLogos/CTVA_Logo_v3.png">
<title>Promo — CTVA Auction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #03050b;
  --surface:  #0c1427;
  --gold:     #E8A23D;
  --text:     #FAF8F2;
  --muted:    rgba(250,248,242,0.6);
  --green2:   #4A7350;
  --signal:   #C23B3B;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#000;}
body{font-family:'Inter',sans-serif;color:var(--text);overflow:hidden;}

#controls{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);}
#controls button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
#controls button:hover{background:rgba(255,255,255,.22);}
#progress{flex:1;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;}
#progress-fill{height:100%;background:var(--gold);width:0%;transition:width .1s linear;}
#hint{position:fixed;top:10px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.5);z-index:50;letter-spacing:.04em;}

.stage{position:relative;width:100vw;height:100vh;max-width:560px;margin:0 auto;background:var(--bg);overflow:hidden;}

.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8vh 7vw;text-align:center;opacity:0;transform:scale(1.04);transition:opacity .5s ease,transform .6s ease;pointer-events:none;}
.slide.active{opacity:1;transform:scale(1);pointer-events:auto;z-index:2;}

.slide::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(250,248,242,.025) 59px,rgba(250,248,242,.025) 60px),repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(250,248,242,.025) 59px,rgba(250,248,242,.025) 60px);pointer-events:none;}

.eyebrow{font-size:3.2vw;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green2);margin-bottom:2.2vh;display:flex;align-items:center;gap:10px;}
.eyebrow::before,.eyebrow::after{content:'';width:22px;height:2px;background:var(--gold);display:inline-block;}

h1.big{font-family:'Anton',sans-serif;font-size:11vw;line-height:.95;letter-spacing:-.01em;}
h1.big span{color:var(--gold);}
.sub{font-size:4vw;color:var(--muted);margin-top:2.4vh;max-width:90%;line-height:1.5;}

.logo-mark{width:96px;height:96px;border-radius:20px;margin-bottom:3vh;object-fit:contain;background:#fff;padding:8px;}

.detail-pill{display:inline-flex;align-items:center;gap:10px;background:rgba(232,162,61,.1);border:1px solid rgba(232,162,61,.35);border-radius:999px;padding:1.6vh 5vw;font-size:4vw;margin-top:1.6vh;}
.detail-pill strong{color:var(--gold);}

.player-photo{width:46vw;height:46vw;max-width:260px;max-height:260px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.5);margin-bottom:3vh;}
.player-name{font-family:'Anton',sans-serif;font-size:8vw;line-height:1;}
.player-club{font-size:3.6vw;color:var(--muted);margin-top:1vh;}

.owners-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4vw;margin-top:3vh;width:100%;max-width:420px;}
.owner-box{display:flex;flex-direction:column;align-items:center;gap:1vh;}
.owner-logo{width:20vw;height:20vw;max-width:110px;max-height:110px;border-radius:16px;object-fit:contain;background:#fff;padding:6px;border:2px solid var(--gold);}
.owner-name{font-size:3.2vw;color:var(--text);font-weight:600;}

.cta-btn{display:inline-block;margin-top:3.4vh;background:var(--gold);color:#03050b;font-weight:800;font-size:4.2vw;padding:2vh 7vw;border-radius:999px;}
.url{margin-top:2.2vh;font-size:3.6vw;color:var(--gold);font-weight:700;letter-spacing:.02em;}

.final-logo{width:30vw;max-width:150px;margin-bottom:2vh;}
</style>
</head>
<body>

<div id="hint">Tap screen-record on your phone, then press Play ▶</div>
<div class="stage" id="stage">
  <div id="slides"></div>
</div>

<div id="controls">
  <button id="btnPlay">▶ Play</button>
  <div id="progress"><div id="progress-fill"></div></div>
  <button id="btnPrev">◀</button>
  <button id="btnNext">▶</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:            "AIzaSyA1L_Wx_csuB_4M7iCBmJBJgpU1US3sxn0",
  authDomain:        "ctva-petition.firebaseapp.com",
  projectId:         "ctva-petition",
  storageBucket:     "ctva-petition.firebasestorage.app",
  messagingSenderId: "899824677710",
  appId:             "1:899824677710:web:c5c5c010431c12c39ae41f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const AUCTION_REF = db.collection('ctva_auctions').doc('current');
const PHOTOS = db.collection('player_photos');
const TEAM_LOGOS = db.collection('team_logos');

function esc(s){ return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const SLIDE_MS = 3200;
let slides = [];
let current = 0;
let playing = false;
let timer = null;
let progressTimer = null;

function staticSlides() {
  return [
    `<div class="slide">
      <div class="eyebrow">Live Player Auction</div>
      <h1 class="big">Own a Player.<br><span>Win Cash.</span></h1>
    </div>`,
    `<div class="slide">
      <div class="eyebrow">5-a-Side Volleyball</div>
      <h1 class="big" style="font-size:9vw;">IPL-Style<br><span>Auction</span></h1>
      <p class="sub">Owners bid live to draft real players — the teams they build play the tournament.</p>
    </div>`,
    `<div class="slide">
      <div class="eyebrow">Save the Date</div>
      <div class="detail-pill">📅 <strong>Saturday, October 10, 2026</strong></div>
      <div class="detail-pill">📍 <strong>Action Zone</strong>, Scarborough</div>
    </div>`,
    `<div class="slide">
      <div class="eyebrow">Before the Tournament</div>
      <h1 class="big" style="font-size:9vw;">Team Draw</h1>
      <div class="detail-pill" style="margin-top:3vh;">🎲 <strong>Friday, October 9</strong></div>
    </div>`
  ];
}

function playerSlide(p, photo) {
  return `<div class="slide">
    <div class="eyebrow">Meet the Players</div>
    <img class="player-photo" src="${photo}" alt="${esc(p.name)}">
    <div class="player-name">${esc(p.name)}</div>
    ${p.club ? `<div class="player-club">${esc(p.club)}</div>` : ''}
  </div>`;
}

function ownersSlide(owners) {
  return `<div class="slide">
    <div class="eyebrow">The Owners</div>
    <h1 class="big" style="font-size:8vw;">8 Owners.<br><span>1 Champion.</span></h1>
    <div class="owners-grid">
      ${owners.map(o => `<div class="owner-box"><img class="owner-logo" src="${o.logo}" alt=""><div class="owner-name">${esc(o.teamName)}</div></div>`).join('')}
    </div>
  </div>`;
}

function finalSlides() {
  return [
    `<div class="slide">
      <div class="eyebrow">Join the Auction</div>
      <div class="detail-pill" style="background:linear-gradient(135deg,rgba(232,162,61,.22),rgba(232,162,61,.1));">💰 Owner Entry: <strong>$400</strong></div>
      <div class="cta-btn">Sign Up Now</div>
    </div>`,
    `<div class="slide">
      <img class="final-logo" src="images/TeamLogos/CTVA_Logo_v3.png" alt="CTVA">
      <h1 class="big" style="font-size:8vw;">CTVA</h1>
      <div class="url">www.ctva.ca/auction.html</div>
    </div>`
  ];
}

function renderSlides(html) {
  document.getElementById('slides').innerHTML = html.map((s,i) => s.replace('<div class="slide"', `<div class="slide" data-i="${i}"`)).join('');
  slides = Array.from(document.querySelectorAll('.slide'));
  showSlide(0);
}

function showSlide(i) {
  current = (i + slides.length) % slides.length;
  slides.forEach((s, idx) => s.classList.toggle('active', idx === current));
  resetProgress();
}

function resetProgress() {
  clearInterval(progressTimer);
  const fill = document.getElementById('progress-fill');
  fill.style.width = '0%';
  if (!playing) return;
  const start = Date.now();
  progressTimer = setInterval(() => {
    const pct = Math.min(100, ((Date.now()-start)/SLIDE_MS)*100);
    fill.style.width = pct + '%';
  }, 50);
}

function play() {
  playing = true;
  document.getElementById('btnPlay').textContent = '⏸ Pause';
  clearInterval(timer);
  timer = setInterval(() => showSlide(current+1), SLIDE_MS);
  resetProgress();
}
function pause() {
  playing = false;
  document.getElementById('btnPlay').textContent = '▶ Play';
  clearInterval(timer);
  clearInterval(progressTimer);
}

document.getElementById('btnPlay').onclick = () => playing ? pause() : play();
document.getElementById('btnNext').onclick = () => { pause(); showSlide(current+1); };
document.getElementById('btnPrev').onclick = () => { pause(); showSlide(current-1); };

(async () => {
  const [auctionSnap, photosSnap, logosSnap] = await Promise.all([
    AUCTION_REF.get(), PHOTOS.get(), TEAM_LOGOS.get()
  ]);
  const data = auctionSnap.data() || {};
  const players = data.players || [];

  const photoMap = {};
  photosSnap.forEach(d => photoMap[d.id] = d.data().photoBase64);
  const logoMap = {};
  logosSnap.forEach(d => logoMap[d.id] = d.data().logoBase64);

  // Pick a diverse spread of player photos: one per distinct club, up to 6.
  const withPhotos = players.filter(p => !p.isCaptain && photoMap[p.id]);
  const byClub = {};
  withPhotos.forEach(p => { const c = p.club || '?'; if (!byClub[c]) byClub[c] = p; });
  const featured = Object.values(byClub).slice(0, 6);

  const owners = players.filter(p => p.isCaptain && logoMap[p.teamId] && p.teamName)
    .map(p => ({ teamName: p.teamName, logo: logoMap[p.teamId] }))
    .slice(0, 6);

  const html = [
    ...staticSlides(),
    ...featured.map(p => playerSlide(p, photoMap[p.id])),
    ...(owners.length ? [ownersSlide(owners)] : []),
    ...finalSlides()
  ];

  renderSlides(html);
})();
</script>
</body>
</html>
